<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="agent-log: tail -f for your coding agents, built for the agents that launched them. Supports Claude Code, Codex CLI, Gemini CLI, opencode, droid and pi.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.32" r="0.55">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif; }
    .term { font-size: 17px; fill: #c9d1d9; white-space: pre; }
    .chip { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
    .chipt { font-size: 20px; fill: #c9d1d9; }
  </style>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- name and pitch -->
  <text class="mono" x="80" y="170" font-size="76" font-weight="700" fill="#f0f6fc"><tspan fill="#3fb950">$</tspan> agent-log</text>
  <rect x="598" y="112" width="34" height="66" fill="#3fb950"/>
  <text class="sans" x="80" y="262" font-size="50" font-weight="700" fill="#f0f6fc"><tspan class="mono" fill="#3fb950">tail -f</tspan> for your</text>
  <text class="sans" x="80" y="322" font-size="50" font-weight="700" fill="#f0f6fc">coding agents</text>
  <text class="sans" x="80" y="384" font-size="24" fill="#8b949e">Built for the agents that launched them:</text>
  <text class="sans" x="80" y="418" font-size="24" fill="#8b949e">status, files changed, errors and the final</text>
  <text class="sans" x="80" y="452" font-size="24" fill="#8b949e">answer, as one screen or one JSON object.</text>

  <!-- terminal motif -->
  <g transform="translate(700 96)">
    <rect x="0" y="0" width="500" height="356" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <path d="M0 12a12 12 0 0 1 12-12h476a12 12 0 0 1 12 12v24h-500z" fill="#21262d"/>
    <circle cx="22" cy="18" r="6" fill="#ff5f57"/><circle cx="42" cy="18" r="6" fill="#febc2e"/><circle cx="62" cy="18" r="6" fill="#28c840"/>
    <text class="mono term" x="22" y="72"><tspan fill="#3fb950">$</tspan> <tspan fill="#f0f6fc" font-weight="700">agent-log</tspan></text>
    <text class="mono term" x="22" y="102" fill="#8b949e">kind      id              status</text>
    <text class="mono term" x="22" y="128">claude    44444444        <tspan fill="#e3b341" font-weight="700">running</tspan></text>
    <text class="mono term" x="22" y="154">codex     22222222        <tspan fill="#3fb950">done</tspan></text>
    <text class="mono term" x="22" y="180">gemini    d9840123        <tspan fill="#3fb950">done</tspan></text>
    <text class="mono term" x="22" y="206">opencode  ses_eb2512259f  <tspan fill="#f85149">failed</tspan></text>
    <text class="mono term" x="22" y="246"><tspan fill="#3fb950">$</tspan> <tspan fill="#f0f6fc" font-weight="700">agent-log summary --json | jq</tspan></text>
    <text class="mono term" x="22" y="276" fill="#8b949e">{ <tspan fill="#79c0ff">"status"</tspan>: <tspan fill="#a5d6ff">"done"</tspan>,</text>
    <text class="mono term" x="22" y="302" fill="#8b949e">  <tspan fill="#79c0ff">"files_changed"</tspan>: [<tspan fill="#a5d6ff">"calc.py"</tspan>],</text>
    <text class="mono term" x="22" y="328" fill="#8b949e">  <tspan fill="#79c0ff">"final_answer"</tspan>: <tspan fill="#a5d6ff">"DONE. Fixed…"</tspan> }</text>
  </g>

  <!-- supported agents -->
  <text class="sans" x="80" y="530" font-size="18" fill="#6e7681" letter-spacing="2">READS SESSIONS FROM</text>
  <g class="sans">
    <rect class="chip" x="80" y="552" width="160" height="44" rx="22"/><text class="chipt" x="160" y="581" text-anchor="middle">Claude Code</text>
    <rect class="chip" x="254" y="552" width="140" height="44" rx="22"/><text class="chipt" x="324" y="581" text-anchor="middle">Codex CLI</text>
    <rect class="chip" x="408" y="552" width="148" height="44" rx="22"/><text class="chipt" x="482" y="581" text-anchor="middle">Gemini CLI</text>
    <rect class="chip" x="570" y="552" width="128" height="44" rx="22"/><text class="chipt" x="634" y="581" text-anchor="middle">opencode</text>
    <rect class="chip" x="712" y="552" width="96" height="44" rx="22"/><text class="chipt" x="760" y="581" text-anchor="middle">droid</text>
    <rect class="chip" x="822" y="552" width="64" height="44" rx="22"/><text class="chipt" x="854" y="581" text-anchor="middle">pi</text>
  </g>
  <text class="sans" x="1200" y="581" font-size="18" fill="#6e7681" text-anchor="end">single Python file · zero deps · MIT</text>
</svg>
