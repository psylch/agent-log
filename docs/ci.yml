name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: python -m unittest discover -s tests -v

  package:
    name: build + install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Install the wheel into a clean venv
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
      - name: Smoke-test the console script
        # run outside the checkout so the installed module is used, not ./agent_log.py
        working-directory: /tmp
        env:
          NO_COLOR: "1"
          AGENT_LOG_TZ: UTC
          AGENT_LOG_NO_CACHE: "1"
        run: |
          set -euo pipefail
          export PATH=/tmp/venv/bin:$PATH
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/home" /tmp/fxhome
          # the wheel's metadata version must match the module's __version__
          test "$(agent-log --version)" = "agent-log $(pip show agent-log | sed -n 's/^Version: //p')"
          agent-log --help | head -5
          HOME=/tmp/fxhome agent-log list --json -n 0 > list.json
          python3 -c 'import json; d = json.load(open("list.json")); assert d["schema_version"] == 1; assert len(d["sessions"]) >= 8, d; print(len(d["sessions"]), "sessions")'
          HOME=/tmp/fxhome agent-log
          HOME=/tmp/fxhome agent-log summary --source claude
          mkdir -p /tmp/emptyhome && HOME=/tmp/emptyhome agent-log | grep -F "No agent sessions found"
      - name: Run the tests from the sdist
        run: |
          mkdir /tmp/sdist && tar -xzf dist/*.tar.gz -C /tmp/sdist --strip-components=1
          cd /tmp/sdist && python -m unittest discover -s tests

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check
